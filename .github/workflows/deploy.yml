name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Project
        run: npm run build

      - name: 📂 Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 155.117.45.192
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "."
          target: "/root/eneflorin.com"
          rm: true

      - name: 🚀 Restart PM2 & Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 155.117.45.192
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/eneflorin.com
            
            # Install production dependencies on the VPS
            npm ci --omit=dev
            
            # Reload PM2 process
            pm2 delete eneflorin.com 2>/dev/null || true
            pm2 start npm --name "eneflorin.com" -- run start -- -p 3003
            pm2 save
            
            # Nginx config should be copied from usa-app/nginx/eneflorin.com.conf
            # Make sure to push usa-app and link the nginx config!
            if [ -f /root/usa-app/nginx/eneflorin.com.conf ]; then
              cp /root/usa-app/nginx/eneflorin.com.conf /etc/nginx/sites-available/eneflorin.com.conf
              ln -sf /etc/nginx/sites-available/eneflorin.com.conf /etc/nginx/sites-enabled/
              systemctl restart nginx
            fi
