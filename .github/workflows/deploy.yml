name: Deploy eneflorin.com to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync source to VPS (no local build)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete --exclude=.git/ --exclude=node_modules/ --exclude=.next/ --exclude=.env"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/root/eneflorin.com"

      - name: Install, Build & PM2 reload on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            cd /root/eneflorin.com

            echo "===== Install all deps (incl devDeps for build) ====="
            npm ci

            echo "===== Build on VPS ====="
            npm run build

            echo "===== Prune devDeps to save memory ====="
            npm prune --omit=dev

            echo "===== Reconciling eneflorin.com PM2 process from usa-app ecosystem ====="
            EXPECTED=$(node -e "let c=require('/root/usa-app/ecosystem.config.js').apps.find(a=>a.name==='eneflorin.com');console.log((c?c.cwd:'')+'|'+(c?c.script:''))")
            CURRENT=$(pm2 jlist | node -e "let d=JSON.parse(require('fs').readFileSync(0));let a=d.find(x=>x.name==='eneflorin.com');if(!a){console.log('MISSING|MISSING')}else{console.log((a.pm2_env.pm_cwd||'')+'|'+(a.pm2_env.pm_exec_path||''))}")
            echo "eneflorin.com expected: $EXPECTED"
            echo "eneflorin.com current:  $CURRENT"
            EXPECTED_CWD=$(echo "$EXPECTED" | cut -d'|' -f1)
            EXPECTED_SCRIPT=$(echo "$EXPECTED" | cut -d'|' -f2)
            CURRENT_CWD=$(echo "$CURRENT" | cut -d'|' -f1)
            CURRENT_EXEC=$(echo "$CURRENT" | cut -d'|' -f2)
            if [ "$CURRENT_CWD" = "$EXPECTED_CWD" ] && [[ "$CURRENT_EXEC" == *"$EXPECTED_SCRIPT" ]]; then
              echo "  → in sync, restart"
              pm2 restart eneflorin.com --update-env
            else
              echo "  → stale/missing/wrong script, recreate"
              pm2 delete eneflorin.com 2>/dev/null || true
              pm2 start /root/usa-app/ecosystem.config.js --only eneflorin.com
            fi
            pm2 save

            echo "===== Waiting 10s to detect crash loop ====="
            sleep 10
            pm2 logs eneflorin.com --lines 40 --nostream --raw || true

            echo "===== HEALTH CHECK ====="
            HEALTH=$(pm2 jlist | node -e "
              let d=JSON.parse(require('fs').readFileSync(0));
              let a=d.find(x=>x.name==='eneflorin.com');
              if(!a){console.log('NOT_FOUND|0|0');process.exit(0)}
              let uptimeMs=Date.now()-a.pm2_env.pm_uptime;
              console.log(a.pm2_env.status+'|'+uptimeMs+'|'+a.pm2_env.restart_time)
            ")
            STATUS=$(echo "$HEALTH" | cut -d'|' -f1)
            UPTIME_MS=$(echo "$HEALTH" | cut -d'|' -f2)
            RESTARTS=$(echo "$HEALTH" | cut -d'|' -f3)
            echo "eneflorin.com: status=$STATUS uptime=${UPTIME_MS}ms restarts=$RESTARTS"
            if [ "$STATUS" != "online" ] || [ "$UPTIME_MS" -lt 8000 ]; then
              echo "  ERROR: eneflorin.com unhealthy - likely crash-looping"
              exit 1
            fi
            echo "✓ eneflorin.com healthy"
